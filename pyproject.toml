[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "ai-speaker"
version = "0.2.0"
description = "A multi-provider AI voice assistant with pluggable LLM, TTS, and STT backends."
readme = "README.md"
requires-python = ">=3.9"
license = { file = "LICENSE" }
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
]
dependencies = [
    "numpy>=1.24.0",
    "ollama>=0.1.6",
    "openwakeword",
    "webrtcvad>=2.0.10",
    "faster-whisper>=1.0.0",
    "sounddevice>=0.4.6",
    "piper-tts>=1.2.0",
    "psutil",
    "scipy",
    "requests",
    "python-dotenv>=1.0.0",
    "supertonic",
]

[project.optional-dependencies]
test = [
    "pytest",
    "unittest-xml-reporting",
]
claude = [
    "anthropic>=0.40.0",
]
openai = [
    "openai>=1.50.0",
]
supertonic = [
    "supertonic",
]
all-providers = [
    "anthropic>=0.40.0",
    "openai>=1.50.0",
    "supertonic",
]

[project.scripts]
ollama-voice-assistant = "voice_assistant.assistant:main"

[project.urls]
"Homepage" = "https://github.com/BranchingBad/ollama-STT-TTS"
"Bug Tracker" = "https://github.com/BranchingBad/ollama-STT-TTS/issues"
